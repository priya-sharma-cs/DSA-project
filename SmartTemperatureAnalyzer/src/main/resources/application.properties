spring.application.name=SmartTemperatureAnalyzer
server.port=8080

# Active Profile Selection:
# 'h2'    -> In-memory database with zero external setup (ideal for demos, grading, and local evaluation)
# 'mysql' -> Persistent MySQL database (requires local MySQL server)
# To switch to MySQL at launch: java -jar app.jar --spring.profiles.active=mysql
spring.profiles.active=h2

# Global JPA settings
spring.jpa.open-in-view=false