# =======================================================
# MySQL Database Configuration (Production / Local Server)
# =======================================================
# Configure through environment variables or application arguments:
# - SPRING_DATASOURCE_URL (defaults to localhost:3306/smart_temperature)
# - SPRING_DATASOURCE_USERNAME (defaults to root)
# - SPRING_DATASOURCE_PASSWORD (defaults to empty)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_temperature?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false
